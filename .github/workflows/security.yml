name: Security Analysis Pipeline

# Ejecuta el pipeline completo SAST+DAST+SCA en cada push.
# Diseñado como demostración del valor de HybridSecScan en CI/CD.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Análisis semanal automático (lunes 09:00 UTC)
    - cron: '0 9 * * 1'

jobs:

  # ── SAST: análisis estático del código fuente ─────────────────────────────
  sast:
    name: SAST -- Bandit + Semgrep
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar herramientas SAST
        run: pip install bandit semgrep --quiet

      - name: Bandit -- análisis estático Python
        run: |
          bandit -r backend/ database/ scripts/ \
            --format json \
            --output sast-bandit.json \
            --severity-level medium || true
          echo "Hallazgos Bandit: $(python -c "import json; d=json.load(open('sast-bandit.json')); print(len(d.get('results',[])))")"

      - name: Semgrep -- patrones de seguridad
        run: |
          semgrep --config=p/python \
                  --config=p/security-audit \
                  --json \
                  --output sast-semgrep.json \
                  backend/ || true

      - name: Upload SAST results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-results
          path: |
            sast-bandit.json
            sast-semgrep.json

  # ── SCA: análisis de dependencias con CVEs ────────────────────────────────
  sca:
    name: SCA -- pip-audit (dependencias vulnerables)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: pip-audit -- dependencias con CVEs conocidos
        run: |
          pip install pip-audit --quiet
          pip-audit --requirement requirements.txt \
                    --format json \
                    --output sca-pip-audit.json \
                    --progress-spinner off || true
          VULN_COUNT=$(python -c "import json; d=json.load(open('sca-pip-audit.json')); print(len(d.get('vulnerabilities',[])))")
          echo "CVEs en dependencias: $VULN_COUNT"
          if [ "$VULN_COUNT" -gt "0" ]; then
            echo "::warning::$VULN_COUNT CVE(s) encontrado(s) en dependencias"
          fi

      - name: Upload SCA results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-results
          path: sca-pip-audit.json

  # ── Linting y formato de código ───────────────────────────────────────────
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar herramientas
        run: pip install flake8 black isort --quiet

      - name: Flake8
        run: |
          flake8 backend/ database/ scripts/ tests/ \
            --max-line-length=120 \
            --ignore=E501,W503

      - name: Black (formato)
        run: black --check backend/ database/ scripts/ tests/

      - name: isort (orden de imports)
        run: isort --check-only backend/ database/ scripts/ tests/

  # ── Tests unitarios e integración ─────────────────────────────────────────
  tests:
    name: Tests -- pytest
    runs-on: ubuntu-latest
    needs: [sast, lint]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt --quiet
          pip install pytest pytest-asyncio pytest-cov httpx --quiet

      - name: Tests de seguridad y autenticación
        run: |
          pytest tests/test_security_validations.py tests/test_auth.py \
            -v --cov=backend --cov=database \
            --cov-report=xml --cov-report=term-missing

      - name: Tests de integración
        run: pytest tests/test_integration.py -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: backend

  # ── Resumen del pipeline ──────────────────────────────────────────────────
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [sast, sca, lint, tests]
    if: always()

    steps:
      - name: Resumen de seguridad
        run: |
          echo "## HybridSecScan Security Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| SAST (Bandit + Semgrep) | ${{ needs.sast.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SCA (pip-audit CVEs) | ${{ needs.sca.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality (flake8/black) | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests (pytest) | ${{ needs.tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Generado por HybridSecScan v2.0 -- OWASP API Security Top 10_" >> $GITHUB_STEP_SUMMARY
